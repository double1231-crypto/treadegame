<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>혼자 시험하기 · 무역 문명 게임</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { padding: 14px 16px 30px; }
    .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
    .bar h1 { font-size: 1.4rem; margin: 0; }
    .bar .muted { font-size: .9rem; }
    .bar .seg { display: inline-flex; gap: 6px; align-items: center; }
    .bar .seg button.on { background: var(--ink); color: var(--accent-ink); }
    .frame { border: 1px solid var(--line-hi); border-radius: 16px; overflow: hidden; background: var(--bg); position: relative; }
    .frame iframe { width: 100%; height: 100%; border: 0; display: block; }
    .frame .tag {
      position: absolute; top: 8px; right: 10px; z-index: 2; font-size: .75rem; font-weight: 700; letter-spacing: .1em;
      padding: 3px 10px; border-radius: 999px; background: rgba(0,0,0,.55); color: var(--muted); pointer-events: none;
    }
    .host-frame { height: 62vh; min-height: 420px; }
    .students { display: grid; gap: 12px; margin-top: 12px; grid-template-columns: repeat(var(--n), minmax(320px, 1fr)); overflow-x: auto; }
    .students .frame { height: 82vh; min-height: 560px; }
  </style>
</head>
<body>
  <div class="bar">
    <h1>🧪 혼자 시험하기</h1>
    <span class="muted">선생님 화면과 학생 화면을 한 페이지에서 함께 써 봐요. 인터넷 연결 없이 이 컴퓨터 안에서만 움직여요 (테스트 모드).</span>
    <span class="grow"></span>
    <span class="seg">학생 수
      <button class="ghost small" data-n="2">2</button>
      <button class="ghost small" data-n="3">3</button>
      <button class="ghost small" data-n="4">4</button>
    </span>
    <button class="small" id="restart">🔄 새 방으로 다시</button>
    <a class="pill" href="index.html" style="color:var(--ink);text-decoration:none">← 첫 화면</a>
  </div>
  <div class="frame host-frame"><span class="tag">선생님 화면</span><iframe id="host" title="선생님 화면"></iframe></div>
  <div class="students" id="students"></div>

  <script>
    if (!/^https?:$/.test(location.protocol)) {
      document.body.innerHTML = '<div class="card" style="max-width:640px;margin:10vh auto;text-align:center"><h2>파일을 바로 열면 동작하지 않아요</h2><p>게임 폴더의 <b>「실행하기.bat」</b>을 더블클릭한 뒤, 첫 화면의 「혼자 시험하기」를 눌러 주세요.</p></div>';
    } else {
      const q = new URLSearchParams(location.search);
      let n = Math.min(4, Math.max(2, Number(q.get('n')) || 3));
      const room = String(Math.floor(1000 + Math.random() * 9000));
      const box = document.getElementById('students');
      document.getElementById('host').src = `host.html?net=local&room=${room}`;
      function students() {
        box.style.setProperty('--n', n);
        box.innerHTML = Array.from({ length: n }, (_, i) =>
          `<div class="frame"><span class="tag">학생 ${i + 1}</span><iframe title="학생 ${i + 1}" src="play.html?net=local&room=${room}&seat=${i + 1}"></iframe></div>`).join('');
        document.querySelectorAll('[data-n]').forEach((b) => b.classList.toggle('on', Number(b.dataset.n) === n));
      }
      // 선생님 화면이 먼저 방을 연 뒤 학생 화면을 열어요
      setTimeout(students, 800);
      document.querySelectorAll('[data-n]').forEach((b) => b.addEventListener('click', () => { n = Number(b.dataset.n); students(); }));
      document.getElementById('restart').addEventListener('click', () => { location.search = `?n=${n}`; });
    }
  </script>
</body>
</html>
