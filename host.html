<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>선생님 화면 · 무역 문명 게임</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
</head>
<body>
  <div class="host" id="app"><p class="center" style="margin-top:80px">방을 만드는 중이에요…</p></div>
  <div class="toasts" id="toasts"></div>
  <script>
// 파일을 더블클릭해서 열면(file://) 브라우저가 게임 스크립트를 막아요. 멈춰 있지 않게 안내를 보여 줍니다.
// (일반 스크립트라 file:// 에서도 실행됩니다)
if (!/^https?:$/.test(location.protocol)) {
  document.getElementById('app').innerHTML =
    '<div class="join-wrap"><div class="card stack center" style="margin-top:10vh">' +
    '<div style="font-size:4rem">📂</div>' +
    '<h2>파일을 바로 열면 게임이 동작하지 않아요</h2>' +
    '<p style="font-size:1.15rem;line-height:1.7">브라우저 보안 규칙 때문에 <b>웹 주소</b>로 열어야 해요.<br>' +
    '① 게임 폴더의 <b>「실행하기.bat」</b>을 더블클릭하면 이 컴퓨터에서 바로 시험할 수 있어요.<br>' +
    '② 수업에서는 <b>GitHub Pages 주소</b>로 열어 주세요.</p>' +
    '</div></div>';
}
  </script>
  <script data-main="js/host.js">
// 자동 업데이트: version.json(항상 새로 받아요)의 버전 번호를 파일 주소에 붙여서, 고친 파일을 바로 받게 해요.
(function () {
  if (!/^https?:$/.test(location.protocol)) return;
  var main = document.currentScript.getAttribute('data-main');
  function go(v, files) {
    if (v) {
      window.__gameVersion = v;
      var map = { imports: {} };
      (files || []).forEach(function (f) { map.imports[new URL(f, location.href).href] = new URL(f + '?v=' + encodeURIComponent(v), location.href).href; });
      var im = document.createElement('script'); im.type = 'importmap'; im.textContent = JSON.stringify(map);
      document.head.appendChild(im);
      var css = document.querySelector('link[href="css/style.css"]');
      if (css) css.href = 'css/style.css?v=' + encodeURIComponent(v);
    }
    var s = document.createElement('script'); s.type = 'module';
    s.src = main + (v ? '?v=' + encodeURIComponent(v) : '');
    document.body.appendChild(s);
  }
  fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (j) { go(j.v, j.files); }, function () { go(null); });
})();
  </script>
</body>
</html>
